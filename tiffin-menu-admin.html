<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Food Menu Admin | Call4All</title><meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="assets/css/style.css">
<style>.fm-wrap{max-width:1180px;margin:auto;padding:28px 18px}.fm-grid{display:grid;grid-template-columns:360px 1fr;gap:18px}.fm-card{background:#fff;border:1px solid #e2e8e5;border-radius:12px;padding:20px}.fm-form label{display:block;margin:10px 0 4px;font-weight:700}.fm-form input,.fm-form textarea,.fm-form select{width:100%;box-sizing:border-box}.fm-form textarea{min-height:64px}.fm-actions{display:flex;gap:8px;margin-top:16px}.fm-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}.fm-item{border:1px solid #e2e8e5;border-radius:10px;padding:14px;border-top:4px solid #2f7650}.fm-item h3{margin:0 0 5px}.fm-price{font-size:21px;font-weight:800;color:#23633f}.fm-muted{color:#65736b;font-size:13px}.fm-item button{margin:10px 6px 0 0}@media(max-width:780px){.fm-grid{grid-template-columns:1fr}}</style>
</head>
<body style="background:#f3f6f4">
<header class="pa-top"><div><strong>Food Menu</strong><div style="font-size:12px;opacity:.78">Manage Call4Thali dishes, images and SEO</div></div><a class="btn btn-outline btn-sm" href="admin.html" style="color:#fff;border-color:#fff">Dashboard</a></header>
<main class="fm-wrap"><div class="fm-grid">
<section class="fm-card"><h2 id="formTitle">Add Menu Dish</h2>
<form class="fm-form" id="menuForm">
<input type="hidden" name="id"><input type="hidden" name="image_path">
<label>Dish Name *</label><input name="name" required maxlength="120" placeholder="Call4Thali Special">
<label>Price (Rs) *</label><input name="price" type="number" min="0" step="1" required>
<label>Description *</label><textarea name="description" required maxlength="500" placeholder="What is included in this thali?"></textarea>
<label>Dish Image</label><input id="menuImage" type="file" accept="image/*"><small class="fm-muted">Upload a clear dish image. It will appear on the public menu.</small>
<label>SEO Title</label><input name="seo_title" maxlength="160">
<label>SEO Description</label><textarea name="seo_description" maxlength="320"></textarea>
<label>SEO Keywords</label><input name="seo_keywords" maxlength="300" placeholder="thali Kukas, veg thali Jaipur">
<label>URL Slug *</label><input name="slug" required pattern="[a-z0-9-]+" maxlength="80" placeholder="call4thali-special">
<div class="pa-row"><div><label>Status</label><select name="status"><option value="active">Active</option><option value="inactive">Inactive</option></select></div><div><label>Sort Order</label><input name="sort_order" type="number" min="0" step="1" value="10"></div></div>
<div id="saveStatus"></div><div class="fm-actions"><button class="pa-btn gold" type="submit">Save Dish</button><button class="pa-btn" id="cancelEdit" type="button" hidden>Cancel</button></div>
</form></section>
<section class="fm-card"><h2>Saved Menu Dishes</h2><p class="fm-muted">Active dishes appear automatically on the public menu and detail pages.</p><div class="fm-list" id="menuList"><p>Loading...</p></div></section>
</div></main>
<script src="assets/js/site.js"></script><script src="assets/js/booking.js"></script><script src="assets/js/tiffin-menu-admin.js"></script>
</body></html>
