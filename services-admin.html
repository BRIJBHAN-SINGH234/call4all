<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Service Records | Call4All Admin</title><meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/properties.css">
<style>
.sr-stats{display:grid;grid-template-columns:repeat(4,minmax(130px,1fr));gap:10px;margin-bottom:18px}.sr-stat{background:#fff;border:1px solid #e2e8e5;border-radius:12px;padding:14px}.sr-stat small{display:block;color:#68736e;margin-bottom:4px}.sr-stat strong{font-size:22px;color:#173f2a}.sr-toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.sr-toolbar input,.sr-toolbar select{min-width:170px;flex:1}.sr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}.sr-card{background:#fff;border:1px solid #e0e6e2;border-radius:14px;padding:16px;box-shadow:0 4px 15px rgba(18,35,24,.06);border-top:4px solid #2f7650}.sr-card.taken{border-top-color:#bf7a1a}.sr-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.sr-card h3{margin:0;color:#193d29;font-size:18px}.sr-chip{display:inline-block;padding:4px 9px;border-radius:16px;background:#dff3e7;color:#23633f;font-size:11px;font-weight:700}.sr-card.taken .sr-chip{background:#fff0d5;color:#84520c}.sr-meta{color:#637069;font-size:13px;line-height:1.65;margin:10px 0}.sr-amount{font-size:20px;font-weight:800;color:#173f2a}.sr-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid #edf0ee}.sr-notes{background:#f6f8f7;border-radius:8px;padding:9px;font-size:13px;color:#4f5d56;margin-top:8px;white-space:pre-wrap}.sr-empty{grid-column:1/-1;text-align:center;padding:32px;color:#68736e}@media(max-width:760px){.pa-grid{grid-template-columns:1fr}.sr-stats{grid-template-columns:repeat(2,1fr)}.sr-toolbar>*{width:100%}}
</style></head>
<body style="background:#f3f6f4">
<header class="pa-top"><div><strong>🤝 Service Records</strong><div style="font-size:12px;opacity:.78">Services taken and provided by Call4All</div></div><a class="btn btn-outline btn-sm" href="admin.html" style="color:#fff;border-color:#fff">Dashboard</a></header>
<main class="pa-wrap">
<div class="sr-stats"><div class="sr-stat"><small>Total Records</small><strong id="statTotal">0</strong></div><div class="sr-stat"><small>Services Provided</small><strong id="statProvided">0</strong></div><div class="sr-stat"><small>Services Taken</small><strong id="statTaken">0</strong></div><div class="sr-stat"><small>Pending Payment</small><strong id="statPending">0</strong></div></div>
<div class="pa-grid">
<section class="pa-card"><h2 id="formTitle">Add Service Record</h2><p style="color:#66736d">Call4All ne service di ya kisi se service li—dono ka record rakhein.</p>
<form class="pa-form" id="serviceForm"><input type="hidden" name="id">
<div class="pa-row"><div><label>Record Type *</label><select name="direction" required><option value="Provided">Service Provided</option><option value="Taken">Service Taken</option></select></div><div><label>Service Date *</label><input name="service_date" type="date" required></div></div>
<label>Service Name *</label><input name="service_name" required maxlength="120" placeholder="e.g. Electrician, Car Rental, Decoration">
<div class="pa-row"><div><label>Customer / Provider Name *</label><input name="party_name" required maxlength="120" placeholder="Person or company name"></div><div><label>Phone</label><input name="contact_phone" type="tel" inputmode="tel" maxlength="15" pattern="[0-9+() -]{7,15}" placeholder="9876543210"></div></div>
<div class="pa-row"><div><label>City</label><input name="city" maxlength="80" value="Jaipur"></div><div><label>Area</label><input name="area" maxlength="100" placeholder="Kukas"></div></div>
<div class="pa-row"><div><label>Amount (₹)</label><input name="amount" type="number" min="0" step="0.01" placeholder="0"></div><div><label>Payment Status</label><select name="payment_status"><option>Pending</option><option>Partial</option><option>Paid</option><option>Not Applicable</option></select></div></div>
<div class="pa-row"><div><label>Work Status</label><select name="work_status"><option>Requested</option><option>Scheduled</option><option>In Progress</option><option>Completed</option><option>Cancelled</option></select></div><div><label>Payment Mode</label><select name="payment_mode"><option value="">Select</option><option>Cash</option><option>UPI</option><option>Bank Transfer</option><option>Card</option><option>Other</option></select></div></div>
<label>Service Details</label><textarea name="details" rows="3" placeholder="What work was requested or completed?"></textarea>
<label>Notes</label><textarea name="notes" rows="2" placeholder="Any follow-up, bill or reference information"></textarea><div id="saveStatus"></div>
<div class="pa-actions"><button class="pa-btn gold" type="submit">Save Service</button><button class="pa-btn" id="cancelEdit" type="button" hidden>Cancel</button></div></form></section>
<section class="pa-card"><h2>Saved Services</h2><div class="sr-toolbar"><input id="searchInput" type="search" placeholder="Search service, person, phone, area…"><select id="directionFilter"><option value="">Taken + Provided</option><option>Provided</option><option>Taken</option></select><select id="statusFilter"><option value="">All work statuses</option><option>Requested</option><option>Scheduled</option><option>In Progress</option><option>Completed</option><option>Cancelled</option></select></div><div class="sr-grid" id="serviceGrid"><p class="sr-empty">Loading…</p></div></section>
</div></main><script src="assets/js/site.js"></script><script src="assets/js/booking.js"></script><script src="assets/js/services-admin.js"></script></body></html>
