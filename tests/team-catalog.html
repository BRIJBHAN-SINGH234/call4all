<!doctype html><html lang="en"><meta charset="utf-8"><title>50 games and admin settings checks</title><body><pre id="result"></pre>
<script src="../assets/js/team-game-catalog.js"></script><script src="../assets/js/team-room-engine.js"></script><script>
try{
const {CATALOG,DEFAULT_IDS,create,act,points,publicTurn}=TeamGameCatalog,{Room,token}=TeamRoom,assert=(v,m)=>{if(!v)throw Error(m)},throws=(fn,m)=>{let yes=false;try{fn()}catch{yes=true}assert(yes,m)};
function rng(seed){let n=seed;return max=>{n=(Math.imul(n,1664525)+1013904223)>>>0;return n%max}}
assert(CATALOG.length===50&&new Set(CATALOG.map(g=>g.id)).size===50,'50 unique games');assert(new Set(CATALOG.map(g=>g.family)).size===10,'10 rule families');
let plays=0;for(const g of CATALOG)for(let seed=1;seed<=30;seed++){let now=1900000000000;const turn=create(g.id,rng(seed),now);turn.id='test';let done=false,steps=0;while(!done){let value;if(turn.game===0){now=turn.readyAt+1;value=turn.targetSequence[turn.index]}else if(turn.game===2)value=turn.targetOrder[turn.index];else if(turn.game===3){now=turn.goAt;value=0}else{const q=turn.questions[turn.index];value=q.answer;const pub=publicTurn(turn,now);assert(!Object.hasOwn(pub.question,'answer'),'Answer hidden');if(q.cells)assert(q.cells.length===16,'Spatial/odd board has 16 cells');else assert(q.options.includes(q.answer),'Correct choice exists');}const result=act(turn,value,now);assert(result.accepted!==false,'Correct action accepted '+g.id);done=result.done;if(++steps>30)throw Error('Game never completes '+g.id)}assert(points(turn)===100,'Perfect play earns 100 '+g.id);plays++;}
throws(()=>new Room('123456',[],{teamCount:0,memberCount:2,gameIds:DEFAULT_IDS}),'Invalid team count');throws(()=>new Room('123456',[],{teamCount:1,memberCount:0,gameIds:DEFAULT_IDS}),'Invalid member count');throws(()=>new Room('123456',[],{teamCount:1,memberCount:2,gameIds:[]}),'Must select games');throws(()=>new Room('123456',[],{teamCount:1,memberCount:2,gameIds:['bad']}),'Unknown game rejected');throws(()=>new Room('123456',[],{teamCount:1,memberCount:2,gameIds:[DEFAULT_IDS[0],DEFAULT_IDS[0]]}),'Duplicates rejected');
let now=1900000000000;const selected=['code-alphabet','hunt-down','memory-reverse','math-mixed','odd-shape'];const room=new Room('123456',[],{teamCount:2,memberCount:3,gameIds:selected,tieGameId:'reaction-patient'});const teams=[];for(let i=0;i<2;i++){const c=room.createTeam('Team '+i,'Captain',token(),now);teams.push(c.table);for(let seat=1;seat<3;seat++)room.joinMember(c.table.code,'Member '+seat,token(),now);throws(()=>room.joinMember(c.table.code,'Extra',token(),now),'Member count enforced');room.approve(c.table.number);for(let seat=0;seat<3;seat++)room.memberReady(c.table,seat);if(!i)assert(!room.canStart(now),'Exact expected team count required');}throws(()=>room.createTeam('Extra','Extra',token(),now),'Extra team rejected');assert(room.maxScore===1500,'Dynamic score maximum');
let turns=0;for(let g=0;g<selected.length;g++){for(const t of teams)t.members.forEach((_,seat)=>room.touch(t,seat,now));room.launch(now);for(let seat=0;seat<3;seat++)for(const table of teams){if(seat)room.next(table,now);const t=table.turn;assert(t.gameId===selected[g],'Admin order respected');let steps=0;while(table.phase==='playing'){let value;if(t.game===0){now=Math.max(now,t.readyAt+1);value=t.targetSequence[t.index]}else if(t.game===2){now=Math.max(now,t.startedAt);value=t.targetOrder[t.index]}else if(t.game===3){now=t.goAt;value=0}else{now=Math.max(now,t.startedAt);value=t.questions[t.index].answer}room.action(table,{turn:t.id,step:t.index,value},now);if(++steps>30)throw Error('Turn loop')}turns++;}assert(room.phase===(g===selected.length-1?'playoffReady':'between'),'Only selected games played');}assert(turns===30,'Every selected game for every configured member');assert(teams.every(t=>t.scores.length===5&&t.scores.every(s=>s===300)),'Dynamic score aggregation');
for(const t of teams)t.members.forEach((_,seat)=>room.touch(t,seat,now));room.launch(now);assert(teams.every(t=>t.turn.gameId==='reaction-patient'),'Admin tie-breaker respected');const restored=Room.restore(JSON.parse(JSON.stringify(room)));assert(JSON.stringify(restored.gameIds)===JSON.stringify(selected)&&restored.memberCount===3&&restored.settings.teamCount===2,'Settings persist across refresh');assert(restored.tables[0].turn.id===teams[0].turn.id,'Active turn preserved');const snapshot=restored.snapshot(1,now,0);assert(snapshot.names.length===5&&snapshot.maxScore===1500&&snapshot.settings.memberCount===3,'Public room reflects settings');
const solo=new Room('654321',[],{teamCount:1,memberCount:1,gameIds:['hunt-prime']});const st=solo.createTeam('Solo','One',token(),now).table;solo.approve(1);solo.memberReady(st,0);solo.launch(now);now=st.turn.startedAt;for(const n of st.turn.targetOrder)solo.action(st,{turn:st.turn.id,step:st.turn.index,value:n},now);assert(solo.phase==='finished'&&solo.winner===1&&solo.maxScore===100,'One team, one member, one game');
const all=new Room('111111',[],{teamCount:1,memberCount:6,gameIds:CATALOG.map(g=>g.id)});assert(all.gameIds.length===50&&all.seeds.length===300&&all.maxScore===30000,'All 50 games configurable with 6 members');
document.body.dataset.tests='PASS: 50 unique games, '+plays+' solved puzzles, private answers, correct 100-point scoring, config validation, exact team/member limits, ordered games, 30 dynamic turns, tie-breaker selection, dynamic scores, refresh persistence, 1-team/1-member/1-game, all 50 selected';
}catch(e){document.body.dataset.tests='FAIL: '+e.stack}document.getElementById('result').textContent=document.body.dataset.tests;
</script></body></html>
