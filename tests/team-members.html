<!doctype html><html lang="en"><meta charset="utf-8"><title>Team membership and refresh checks</title><body><pre id="result"></pre>
<script src="../assets/js/team-room-engine.js"></script><script>
try{
const {Room,token}=TeamRoom,assert=(x,m)=>{if(!x)throw Error(m)},throws=(fn,m)=>{let yes=false;try{fn()}catch{yes=true}assert(yes,m)};let now=1900000000000;
const room=new Room('123456');assert(!room.canStart(now),'Empty room cannot start');const captain=token(),c=room.createTeam('Lions','Captain',captain,now);assert(room.tables.length===1&&c.seat===0,'Captain creates team and first seat');assert(/^123456-[0-9A-F]{6}$/.test(c.table.code),'Shareable room/team code');assert(room.createTeam('Lions','Captain',captain,now).table===c.table&&room.tables.length===1,'Retried creation does not duplicate team');const tickets=[captain,token(),token(),token()];tickets.slice(1).forEach((claim,i)=>{const m=room.joinMember(c.table.code,'Member '+i,claim,now);assert(m.seat===i+1,'Member gets own slot')});throws(()=>room.joinMember(c.table.code,'Extra',token(),now),'Exactly four members');const member=room.joinMember(c.table.code,'Changed name',tickets[1],now);assert(member.seat===1&&member.table.members.filter(Boolean).length===4,'Reconnect never adds fifth member');assert(member.table.players[1]==='Member 0','Reconnect preserves name');
throws(()=>room.joinMember('123456-FFFFFF','Wrong',token(),now),'Unknown team rejected');throws(()=>room.memberReady(c.table,0),'Host approval required');room.approve(1);for(let seat=0;seat<3;seat++)room.memberReady(c.table,seat);assert(!room.canStart(now),'Every member must ready');room.memberReady(c.table,3);assert(room.canStart(now),'Four approved online ready members');room.launch(now);const turn=c.table.turn;const originalId=turn.id;assert(room.snapshot(1,now,1).mine.turn===null,'Other members cannot inspect active puzzle');assert(room.snapshot(1,now,0).mine.turn.id===turn.id,'Current member gets own turn');assert(!JSON.stringify(room.snapshot(1,now,0)).includes(tickets[1]),'Tickets stay private');
now+=9500;room.action(c.table,{turn:turn.id,step:0,value:turn.sequence[0]},now);assert(turn.index===1,'Answer progress stored');room.pause(now);const checkpoint=JSON.parse(JSON.stringify(room));const restored=Room.restore(checkpoint);const deadline=restored.tables[0].turn.deadline;restored.tables[0].members[0].connected=false;restored.tick(now+60000);assert(restored.tables[0].turn.id===originalId&&restored.tables[0].turn.index===1&&restored.tables[0].phase==='playing','Long refresh does not expire/reset turn');assert(!restored.action(restored.tables[0],{turn:originalId,step:1,value:turn.sequence[1]},now+60000),'Paused actions rejected');for(let seat=0;seat<4;seat++)restored.joinMember(c.table.code,'ignored',tickets[seat],now+60000);restored.tick(now+60000);assert(!restored.pausedAt,'Auto resume after all reconnect');assert(restored.tables[0].turn.deadline===deadline+60000,'Only paused duration added');assert(restored.tables[0].turn.index===1&&restored.tables[0].turn.correct===1,'Previous answers preserved');assert(restored.tables[0].turn.id===originalId,'Turn not regenerated');assert(restored.tables.length===1&&restored.tables[0].members.filter(Boolean).length===4,'Roster unchanged');
const snapshot=restored.snapshot(1,now+60000,1);assert(snapshot.mine.code===c.table.code&&snapshot.mine.seat===1,'Membership restored in snapshot');throws(()=>restored.createTeam('New','New',token(),now),'No new teams after start');
const oldRoom=new Room('654321',['Old team']);const oldTable=oldRoom.join(1,['Old captain','P2','P3','P4'],null,now);oldRoom.approve(1);oldRoom.ready(oldTable);oldRoom.launch(now);oldTable.turn.index=1;oldTable.turn.correct=1;oldTable.scores[0]=15;const oldTurn=oldTable.turn.id,oldTicket=oldTable.ticket;const migrated=Room.restore(JSON.parse(JSON.stringify(oldRoom)));assert(migrated.tables[0].turn.id===oldTurn&&migrated.tables[0].turn.index===1&&migrated.tables[0].scores[0]===15,'Old room migration preserves game and score');assert(migrated.joinMember(migrated.tables[0].code,'Old captain',oldTicket,now).seat===0,'Old captain ticket still works');
document.body.dataset.tests='PASS: empty room, captain creation, shared team code, four separate members, captain retries, no duplicate seats, readiness gates, private turn/tickets, persisted answers, long refresh pause, automatic reconnect resume, unchanged turn ID and scores';
}catch(e){document.body.dataset.tests='FAIL: '+e.stack}document.getElementById('result').textContent=document.body.dataset.tests;
</script></body></html>
