<!doctype html><body><script>
(async()=>{
const assert=(v,m)=>{if(!v)throw Error(m)},sleep=ms=>new Promise(r=>setTimeout(r,ms)),wait=async(fn,label)=>{for(let i=0;i<800;i++){if(fn())return;await sleep(25)}throw Error('Wait timeout: '+label)};const run=Date.now();
const frame=async(name,url='billing-workspace.html')=>{const f=document.createElement('iframe');f.name=run+name;f.src='/'+url;document.body.append(f);await new Promise(r=>f.onload=r);return f};const refresh=async f=>{f.contentWindow.location.reload();await new Promise(r=>f.onload=r);return f.contentWindow};
const input=(w,id,value)=>{const e=w.document.getElementById(id);e.value=value;e.dispatchEvent(new w.Event('input'))};
const login=async(w,mobile,password)=>{const f=w.document.getElementById('workspaceLogin');f.elements.mobile.value=mobile;f.elements.password.value=password;f.dispatchEvent(new w.Event('submit',{cancelable:true}));await wait(()=>!w.document.getElementById('workspace').hidden,'login');await wait(()=>w.document.querySelector('[data-id="f1"]'),'food menu')};
try{
const af=await frame('alice');let a=af.contentWindow;await login(a,'9000000001','password-a');input(a,'table','A-'+run);a.document.querySelector('[data-id="f1"][data-variant="Full"]').click();a.document.querySelector('[data-id="f1"][data-variant="Full"]').click();assert(a.document.getElementById('toast').textContent.includes('added'),'Item click confirmation');assert(a.document.querySelector('.bw-added').textContent.includes('2'),'Visible added count');a.document.getElementById('newFood').click();input(a,'table','B-'+run);a.document.querySelector('[data-id="f2"]').click();a=await refresh(af);await wait(()=>!a.document.getElementById('workspace').hidden,'auto login after refresh');assert(a.document.getElementById('table').value==='B-'+run,'Active pending table restored');const tabA=Array.from(a.document.querySelectorAll('.bw-tab')).find(b=>b.textContent.includes('A-'+run));assert(tabA,'Other pending table survived');tabA.click();assert(a.document.getElementById('cartList').textContent.includes('2'),'Previous table item quantity survived');a.document.getElementById('saveBill').click();await wait(()=>a.document.getElementById('saveState').textContent==='Saved','first draft sync');
a.document.getElementById('newBeverage').click();input(a,'table','DRINK-'+run);input(a,'phone','9000000099');await wait(()=>a.document.querySelector('[data-variant="Packet"]'),'beverage menu');a.document.querySelector('[data-variant="Packet"]').click();a.document.querySelector('[data-variant="Single"]').click();a.document.querySelector('[data-variant="Single"]').click();a.document.getElementById('generateBill').click();await wait(()=>a.document.getElementById('generateBill').hidden,'bill generated');const billNo=a.document.getElementById('billNo').value;assert(a.document.getElementById('billDetails').textContent.includes('Alice'),'Creator shown');const staffSession=a.BillingAPI.session('c4b_staff_session');let stock=await a.BillingAPI.request('/stock',{token:staffSession.token});assert(stock.items[0].stock===88,'Packet/single stock decremented exactly');
const bf=await frame('bob');const b=bf.contentWindow;await login(b,'9000000002','password-b');b.document.getElementById('oldBills').click();await wait(()=>b.document.getElementById('historyList').textContent.includes(billNo),'Shared bill history includes other user');const article=Array.from(b.document.querySelectorAll('.bw-history-item')).find(x=>x.textContent.includes(billNo));article.querySelector('button').click();await wait(()=>b.document.getElementById('billNo').value===billNo,'Open shared generated bill');const plus=Array.from(b.document.querySelectorAll('.fb-cart-row')).find(r=>r.textContent.includes('Single')).querySelector('[data-delta="1"]');plus.click();b.document.getElementById('saveBill').click();await wait(()=>b.document.getElementById('saveState').textContent==='Saved','Generated edit saved');stock=await b.BillingAPI.request('/stock',{token:b.BillingAPI.session('c4b_staff_session').token});assert(stock.items[0].stock===87,'Generated edit adjusts stock delta');assert(b.document.getElementById('billDetails').textContent.includes('Last updated by: Bob'),'Updater attribution');
b.document.getElementById('oldBills').click();await wait(()=>b.document.getElementById('historyList').textContent.includes('OLD-TEST'),'Old bill still in history');const old=Array.from(b.document.querySelectorAll('.bw-history-item')).find(x=>x.textContent.includes('OLD-TEST'));old.querySelector('button').click();await wait(()=>b.document.getElementById('table').value==='OLD-TEST','Open locked bill');assert(b.document.getElementById('table').disabled&&b.document.getElementById('discount').disabled,'Old bill editing disabled');assert(Array.from(b.document.querySelectorAll('#menuGrid button')).every(x=>x.disabled),'Old bill cannot add items');const cf=b.document.getElementById('commentForm');cf.elements.body.value='Payment note '+run;cf.dispatchEvent(new b.Event('submit',{cancelable:true}));await wait(()=>b.document.getElementById('comments').textContent.includes('Payment note '+run),'Comment allowed after lock');assert(b.document.getElementById('comments').textContent.includes('Bob'),'Comment actor visible');
const adminf=await frame('admin','billing-stock-admin.html'),admin=adminf.contentWindow;const form=admin.document.getElementById('adminLogin');form.elements.mobile.value='admin';form.elements.password.value='test-only-admin-password';form.dispatchEvent(new admin.Event('submit',{cancelable:true}));await wait(()=>!admin.document.getElementById('adminWorkspace').hidden,'Admin login');await wait(()=>admin.document.getElementById('stockLedger').textContent.includes('Bob'),'Ledger shows who reduced stock');assert(admin.document.getElementById('stockList').textContent.includes('87'),'Current stock shown');admin.document.querySelector('[data-restock]').click();const rf=admin.document.getElementById('restockForm');rf.elements.packets.value=1;rf.elements.singles.value=2;rf.elements.note.value='Restock UI '+run;rf.dispatchEvent(new admin.Event('submit',{cancelable:true}));await wait(()=>admin.document.getElementById('stockList').textContent.includes('99'),'Restock adds packet units and singles');assert(admin.document.getElementById('stockLedger').textContent.includes('Billing Admin'),'Restock actor recorded');
document.body.dataset.tests='PASS: multi-table food drafts, refresh recovery, active table preserved, item click feedback, food/beverage bills, packet/single deduction, all-user shared history, creator/updater, editable first hour, locked old bill, comments after lock, live stock, actor ledger, admin restock';
}catch(e){document.body.dataset.tests='FAIL: '+e.stack}
})();
</script></body>
