<!doctype html><html lang="en"><meta charset="utf-8"><title>Team room engine checks</title><body><script src="../assets/js/team-game-catalog.js"></script>
<script src="../assets/js/team-room-engine.js"></script><script>
try{
const {Room}=TeamRoom,assert=(x,m)=>{if(!x)throw Error(m)},throws=(fn,m)=>{let yes=false;try{fn()}catch{yes=true}assert(yes,m)};
let now=1900000000000;const r=new Room('123456',['Red','Blue']);
throws(()=>r.launch(now),'No host start before joining');throws(()=>r.join(3,['a','b','c','d'],null,now),'Only created tables');throws(()=>r.join(1,['a','b'],null,now),'Exactly 4 players');const a=r.join(1,['A','B','C','D'],null,now),b=r.join(2,['E','F','G','H'],null,now);throws(()=>r.join(1,['a','b','c','d'],null,now),'Occupied table protected');assert(r.join(1,[],a.ticket,now)===a,'Ticket reconnect');throws(()=>r.ready(a),'Approve before ready');r.approve(1);r.approve(2);r.ready(a);throws(()=>r.launch(now),'All teams must be ready');r.ready(b);assert(r.canStart(now),'All teams ready');assert(!JSON.stringify(r.snapshot(1,now)).includes(a.ticket),'No tickets in shared state');r.launch(now);assert(a.turn.startedAt===b.turn.startedAt&&a.turn.startedAt===now+5000,'Synchronized countdown');assert(JSON.stringify(a.turn.sequence)===JSON.stringify(b.turn.sequence),'Equal challenges per position');assert(r.action(a,{turn:a.turn.id,step:0,value:a.turn.sequence[0]},now)===false,'Countdown input rejected');
let turns=0;function win(t,reaction=200){const turn=t.turn;now=Math.max(now,turn.startedAt+4500);if(turn.game===0){assert(!r.snapshot(t.number,now).mine.turn.sequence,'Sequence hidden after preview');turn.sequence.forEach(value=>r.action(t,{turn:turn.id,step:turn.index,value},now))}else if(turn.game===1){for(let i=0;i<8;i++)r.action(t,{turn:turn.id,step:turn.index,value:turn.questions[turn.index].ink},now)}else if(turn.game===2){for(let i=1;i<=12;i++)r.action(t,{turn:turn.id,step:turn.index,value:i},now)}else{now=turn.goAt+reaction;r.action(t,{turn:turn.id,step:0,value:0},now)}turns++}
for(let g=0;g<4;g++){if(g){for(const t of r.tables){t.connected=true;t.lastSeen=now}r.launch(now)}for(let p=0;p<4;p++)for(const t of r.tables){if(p)r.next(t,now);win(t)}assert(r.phase===(g===3?'playoffReady':'between'),'Host controls next game');}
assert(turns===32,'All players all four games');assert(a.scores.reduce((x,y)=>x+y,0)===1560,'Authoritative totals');for(const t of r.tables){t.connected=true;t.lastSeen=now}r.launch(now);for(let p=0;p<4;p++)for(const t of r.tables){if(p)r.next(t,now);win(t,t.number===1?100:400)}assert(r.phase==='finished'&&r.winner===1,'Exactly one playoff winner');assert(Room.restore(JSON.parse(JSON.stringify(r))).winner===1,'Room restore');
const x=new Room('654321',['Solo']);const t=x.join(1,['A','B','C','D'],null,now);x.approve(1);x.ready(t);x.launch(now);const turn=t.turn;assert(!x.action(t,{turn:'forged',step:0,value:1},now+5000),'Stale turn rejected');x.action(t,{turn:turn.id,step:0,value:(turn.sequence[0]+1)%16},now+10000);assert(t.phase==='result'&&t.last.score===0,'Wrong memory ends turn');const score=t.scores[0];x.action(t,{turn:turn.id,step:0,value:turn.sequence[0]},now+10000);assert(t.scores[0]===score,'No double scoring');x.next(t,now+10000);x.tick(t.turn.deadline+1);assert(t.phase==='result'&&t.last.score===0,'Timeout settles turn');assert(!t.connected,'Heartbeat expires');
x.phase='playing';x.game=3;x.startTurn(t,now);x.action(t,{turn:t.turn.id,step:0,value:0},now+1);assert(t.last.early&&t.last.score===0,'Early reaction no points');
x.tie([1]);x.playoff.candidates=[1,2];x.tables.push({number:2,phase:'complete'});x.playoff.scores={1:100,2:100};x.playoff.times={1:1000,2:1000};x.phase='playing';t.phase='complete';x.checkRound(now);assert(x.phase==='playoffReady'&&x.playoff.round===2,'Exact ties repeat');
document.body.dataset.tests='PASS: roster, admin start gates, approval, readiness, reconnect tickets, hidden secrets, synchronized turns, all 32 turns, equal puzzles, authoritative scores, next-game control, playoffs, one champion, reload, timeouts, disconnect, anti-replay';
}catch(e){document.body.dataset.tests='FAIL: '+e.stack}
</script><pre id="result"></pre><script>document.getElementById("result").textContent=document.body.dataset.tests;</script></body></html>
