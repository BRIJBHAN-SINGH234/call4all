<!doctype html><html lang="en-IN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Call4Thali Menu | Call4All Kukas</title><meta name="description" content="Call4Thali menu item in Kukas Jaipur."><meta name="robots" content="index,follow"><link rel="stylesheet" href="assets/css/style.css"></head><body><div id="site-header"></div><main class="tiffin-shell"><span class="section-eyebrow">Call4Thali · Kukas, Jaipur</span><h1 id="dishName">Menu Dish</h1><p id="dishDescription">Loading dish details...</p><p id="dishPrice" class="tiffin-price-pill"></p><p><a class="btn btn-accent" href="tel:+917737353588">Call to Order</a> <a href="tiffin-center-kukas.html">View full menu</a></p></main><div id="site-footer"></div><script src="assets/js/site.js"></script><script src="assets/js/booking.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const slug=new URLSearchParams(location.search).get('slug');try{const rows=(await CsvAPI.loadAllPublic('data/tiffin-menu.csv')).items;const d=rows.find(x=>x.slug===slug&&String(x.status).toLowerCase()==='active');if(!d)throw Error('Not found');document.title=d.seo_title||d.name;document.querySelector('meta[name="description"]').content=d.seo_description||d.description;document.getElementById('dishName').textContent=d.name;document.getElementById('dishDescription').textContent=d.description;document.getElementById('dishPrice').textContent='Rs '+d.price}catch(e){document.getElementById('dishName').textContent='Menu dish not found';document.getElementById('dishDescription').textContent='Please view the current menu or call to order.'}});</script></body></html>
