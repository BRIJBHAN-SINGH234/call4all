<!doctype html>
<html lang="en-IN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Call4Thali Menu | Call4All Kukas Jaipur</title><meta name="description" content="Explore Call4Thali menu details, prices and booking options in Kukas, Jaipur."><meta name="keywords" content="Call4Thali menu Kukas Jaipur, veg thali price Kukas, book thali Jaipur"><meta name="robots" content="index,follow"><link rel="stylesheet" href="assets/css/style.css"></head>
<body><div id="site-header"></div><main class="tiffin-shell"><span class="section-eyebrow">Call4Thali | Kukas, Jaipur</span><img id="dishImage" alt="" style="display:none;width:100%;max-width:760px;max-height:420px;object-fit:cover;border-radius:12px;margin:18px 0"><h1 id="dishName">Menu Dish</h1><p id="dishDescription">Loading dish details...</p><p id="dishPrice" class="tiffin-price-pill"></p><p><a class="btn btn-accent" href="tiffin-center-kukas.html#book">Book Now</a> <a id="whatsappDish" class="btn btn-success" href="#" target="_blank" rel="noopener">Order on WhatsApp</a> <a class="btn btn-outline-dark" href="tiffin-center-kukas.html">View Full Menu</a></p></main><div id="site-footer"></div>
<script src="assets/js/site.js"></script><script src="assets/js/booking.js"></script><script>
document.addEventListener('DOMContentLoaded', async () => { const slug = new URLSearchParams(location.search).get('slug'); try { const rows = (await CsvAPI.loadAllPublic('data/tiffin-menu.csv')).items; const dish = rows.find(item => item.slug === slug && String(item.status).toLowerCase() === 'active'); if (!dish) throw Error('Not found'); const title = dish.seo_title || `${dish.name} in Kukas Jaipur | Call4Thali | Call4All`; const description = dish.seo_description || `${dish.name} at Rs ${dish.price} in Kukas Jaipur. ${dish.description}`; document.title = title; document.querySelector('meta[name="description"]').content = description; document.querySelector('meta[name="keywords"]').content = dish.seo_keywords || `${dish.name} Kukas Jaipur, Call4Thali menu, veg thali price Jaipur`; document.getElementById('dishName').textContent = dish.name; document.getElementById('dishDescription').textContent = dish.description; document.getElementById('dishPrice').textContent = 'Rs ' + dish.price; if (dish.image_path) { const image = document.getElementById('dishImage'); image.src = dish.image_path; image.alt = dish.name + ' vegetarian thali in Kukas Jaipur'; image.style.display = 'block'; } const message = encodeURIComponent(`Hello Call4All, I would like to order ${dish.name} at Rs ${dish.price} in Kukas, Jaipur.`); document.getElementById('whatsappDish').href = 'https://wa.me/917737353588?text=' + message; const script = document.createElement('script'); script.type = 'application/ld+json'; script.textContent = JSON.stringify({'@context':'https://schema.org','@type':'MenuItem',name:dish.name,description:description,offers:{'@type':'Offer',price:dish.price,priceCurrency:'INR',availability:'https://schema.org/InStock'}}); document.head.appendChild(script); } catch (error) { document.getElementById('dishName').textContent = 'Menu dish not found'; document.getElementById('dishDescription').textContent = 'Please view the current menu or call to order.'; } });
</script></body></html>
