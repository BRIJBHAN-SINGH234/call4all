<!doctype html><html lang="en-IN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Building Materials Admin | Call4All</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="assets/css/style.css"><style>.bma-wrap{max-width:1240px;margin:auto;padding:28px 18px}.bma-layout{display:grid;grid-template-columns:390px 1fr;gap:18px}.bma-panel{background:#fff;border:1px solid #dfe7e2;border-radius:15px;padding:22px}.bma-form label{display:block;margin:11px 0 5px;font-weight:750}.bma-form input,.bma-form textarea,.bma-form select{width:100%;box-sizing:border-box}.bma-form textarea{min-height:82px}.bma-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.bma-actions{display:flex;gap:8px;margin-top:16px}.bma-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:13px}.bma-item{border:1px solid #dfe7e2;border-radius:12px;overflow:hidden}.bma-item img{width:100%;height:150px;object-fit:cover;background:#e8ece8}.bma-body{padding:14px}.bma-body h3{margin:0 0 5px}.bma-price{font-size:20px;font-weight:850;color:#23633f}.bma-muted{color:#65736b;font-size:12px}.bma-item button{margin:10px 5px 0 0}@media(max-width:820px){.bma-layout{grid-template-columns:1fr}}</style></head><body style="background:#f3f6f4"><header class="pa-top"><div><strong>🏗️ Building Materials</strong><div style="font-size:12px;opacity:.78">Manage products, prices, images and SEO</div></div><div><a class="btn btn-outline btn-sm" href="building-materials-jaipur.html" target="_blank" style="color:#fff;border-color:#fff">View Page</a> <a class="btn btn-outline btn-sm" href="admin.html" style="color:#fff;border-color:#fff">Dashboard</a></div></header><main class="bma-wrap"><div class="bma-layout"><section class="bma-panel"><h2 id="formTitle">Add Material</h2><form class="bma-form" id="materialForm"><input type="hidden" name="image_path"><label>Material name *</label><input name="name" required maxlength="100" placeholder="e.g. Cement OPC 43"><label>Category *</label><input name="category" required maxlength="80" placeholder="Stone Aggregate, Cement, Sand"><div class="bma-row"><div><label>Price (₹) *</label><input name="price" type="number" min="0" step=".01" required></div><div><label>Unit *</label><input name="unit" required maxlength="30" placeholder="Ton, Bag, Piece"></div></div><div class="bma-row"><div><label>City *</label><input name="city" required value="Jaipur"></div><div><label>Area</label><input name="area" value="Kukas"></div></div><label>Description *</label><textarea name="description" required maxlength="600"></textarea><label>Product image *</label><input id="materialImage" type="file" accept="image/png,image/jpeg,image/webp"><small class="bma-muted">Clear landscape product image. Existing image remains unless a new file is selected.</small><label>SEO title</label><input name="meta_title" maxlength="65"><label>SEO description</label><textarea name="meta_description" maxlength="165"></textarea><label>SEO keywords</label><input name="seo_keywords" maxlength="300"><label>Image alt text</label><input name="image_alt" maxlength="180"><div class="bma-row"><div><label>Status</label><select name="status"><option>Active</option><option>Inactive</option></select></div><div><label>Featured</label><select name="featured"><option>Yes</option><option>No</option></select></div></div><div id="saveStatus" class="bma-muted"></div><div class="bma-actions"><button class="pa-btn gold" type="submit">Save Material</button><button class="pa-btn" type="button" id="cancelEdit" hidden>Cancel</button></div></form></section><section class="bma-panel"><h2>Saved Materials</h2><p class="bma-muted">Every Active row automatically appears on the public Jaipur catalog.</p><div class="bma-list" id="materialList"><p>Loading…</p></div></section></div></main><script src="assets/js/site.js"></script><script src="assets/js/booking.js"></script><script src="assets/js/building-materials-admin.js"></script></body></html>
