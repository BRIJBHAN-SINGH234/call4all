<style>
:root{--ink:#18372f;--green:#17694f;--lime:#d9f477;--paper:#f5f6f0;--line:#dbe2d5;--muted:#657369}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,sans-serif}button,input{font:inherit}button,a,input{touch-action:manipulation}button{cursor:pointer}button:disabled{cursor:default;opacity:.55}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #d98926;outline-offset:3px}[hidden]{display:none!important}header{background:var(--ink);color:#fff;padding:16px max(18px,calc((100vw - 1000px)/2));display:flex;align-items:center;justify-content:space-between;gap:18px}header a{color:var(--lime);font-size:13px}main{max-width:1000px;margin:32px auto;padding:0 18px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:2px;font-weight:800;color:var(--green)}h1,h2{font-family:Georgia,serif;line-height:1.1}h1{font-size:clamp(38px,7vw,62px);margin:12px 0}h2{font-size:30px;margin:10px 0 18px}p{color:var(--muted)}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:clamp(18px,4vw,32px);margin:20px 0}.games{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:24px 0}.game-info{padding:16px;background:#e9eede;border-radius:8px;font-size:13px}.game-info strong{display:block;font-size:15px;margin-bottom:5px}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.button{display:inline-flex;align-items:center;justify-content:center;min-height:46px;border:0;border-radius:7px;padding:11px 18px;background:var(--green);color:#fff;font-weight:750}.button.secondary{background:#eaf0e4;color:var(--ink)}.button.danger{background:#fff0ea;color:#9e382b}.teams{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.team{margin:0;padding:18px;border:1px solid var(--line);border-radius:9px;min-width:0}.team legend{font-weight:800;padding:0 5px}label{display:block;font-size:13px;font-weight:700;margin:10px 0}input{display:block;width:100%;padding:10px 12px;border:1px solid #bac8b7;border-radius:6px;background:#fff;color:var(--ink);margin-top:5px}.players{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.error{color:#a5392b;font-weight:700;min-height:24px}.turn-head{display:flex;justify-content:space-between;align-items:center;gap:15px}.pill{background:var(--lime);padding:8px 13px;border-radius:6px;font-weight:850;white-space:nowrap;font-variant-numeric:tabular-nums}.arena{max-width:650px;margin:20px auto;text-align:center;min-height:330px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;max-width:360px;margin:20px auto}.cell{aspect-ratio:1;border:1px solid #becdb6;border-radius:9px;background:#f1f5e9;font-size:25px;font-weight:800;color:var(--ink)}.cell.flash,.cell.hit{background:var(--lime);border-color:var(--green)}.colour-word{font-size:clamp(40px,9vw,64px);font-weight:900;margin:28px 0}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:400px;margin:auto}.reaction{width:min(100%,430px);min-height:220px;border:0;border-radius:12px;background:#b54c3c;color:white;font-size:30px;font-weight:850;padding:24px}.reaction.go{background:var(--green);color:var(--lime)}.score{font:64px/1 Georgia,serif;margin:20px 0;color:var(--green)}.board{overflow-x:auto}table{width:100%;border-collapse:collapse;text-align:left;white-space:nowrap}th,td{padding:12px;border-bottom:1px solid var(--line)}th{font-size:12px;color:var(--muted)}.winner{background:var(--lime);padding:25px;border-radius:10px}.winner h2{font-size:40px;margin-bottom:10px}.small{font-size:13px}.status{min-height:26px;font-weight:750;color:var(--green)}.subhead{font-size:13px;color:var(--muted)}footer{margin:24px 0;color:var(--muted);font-size:12px}@media(max-width:650px){.games{grid-template-columns:1fr 1fr}.teams{grid-template-columns:1fr}.turn-head{align-items:flex-start}main{margin-top:22px}.panel{margin-top:14px}.arena{min-height:300px}.players{gap:0 10px}header{font-size:14px}}

select{font:inherit;padding:10px}.lobby-table{display:grid;grid-template-columns:1fr auto;gap:8px;padding:16px;border:1px solid var(--line);border-radius:8px;margin:10px 0}.connected{color:var(--green)}.offline{color:#a5392b}.room-code{font-size:clamp(34px,8vw,56px);letter-spacing:5px;font-weight:850}.notice{padding:12px 16px;background:#eaf0e4;border-radius:7px;margin:12px 0}.network{min-height:24px;color:#a5392b;font-weight:700}.cell:disabled{opacity:1}.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.role-grid .panel{margin:0}.turn-head h2{overflow-wrap:anywhere}.table-number{font-size:28px;font-weight:850}@media(max-width:650px){.role-grid{grid-template-columns:1fr}.lobby-table{grid-template-columns:1fr}}
