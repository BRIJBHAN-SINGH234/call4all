<!doctype html><html lang="en-IN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Call4Food Billing</title><link rel="stylesheet" href="assets/css/food-billing.css?v=20261017-6"></head><body class="fb-body">
<section id="loginView" class="fb-login"><form id="billingLogin" class="fb-login-card"><div class="fb-brand" style="color:#111">Call4<span>Food</span></div><h1>Staff Billing Login</h1><p>Only admin-created accounts can access billing.</p><div class="fb-field"><label for="loginMobile">Mobile number</label><input id="loginMobile" name="mobile" type="tel" inputmode="numeric" autocomplete="username" required placeholder="10 digit mobile"></div><div class="fb-field"><label for="loginPassword">Password</label><input id="loginPassword" name="password" type="password" autocomplete="current-password" required></div><div id="loginError" class="fb-error"></div><button class="fb-btn fb-btn-block" type="submit">Login</button></form></section>
<div id="billingView" hidden><header class="fb-top"><div class="fb-brand">Call4<span>Food</span> <small>Billing</small></div><div class="fb-user"><span id="staffName"></span><button id="logoutBtn" class="fb-btn fb-btn-danger">Logout</button></div></header><main class="fb-shell"><section class="fb-order-meta"><div class="fb-field"><label>Table No.</label><input id="tableNo" inputmode="numeric" placeholder="e.g. 5"></div><div class="fb-field"><label>Customer Name</label><input id="customerName" placeholder="Optional"></div><div class="fb-field"><label>Customer WhatsApp *</label><input id="customerPhone" type="tel" inputmode="numeric" placeholder="10 digit number"></div><div class="fb-field"><label>Bill No.</label><input id="billNo" readonly></div></section><div class="fb-layout"><section class="fb-menu-panel"><div class="fb-tools"><input id="menuSearch" type="search" placeholder="Search dish..."></div><div id="categories" class="fb-cats"></div><div id="menuGrid" class="fb-menu"></div></section><aside class="fb-cart"><h2>Customer Bill</h2><div id="billHeader"></div><div id="cartList" class="fb-cart-list"></div><div class="fb-summary"><div class="fb-sum-row"><span>Subtotal</span><strong id="subtotal">₹0</strong></div><div class="fb-sum-row"><label for="discount">Discount</label><input id="discount" class="fb-inline-input" type="number" min="0" value="0"></div><div class="fb-sum-row"><label for="tax">Tax %</label><input id="tax" class="fb-inline-input" type="number" min="0" value="0"></div><div class="fb-sum-row fb-total"><span>Total</span><span id="grandTotal">₹0</span></div></div><div class="fb-cart-actions"><button id="newBillBtn" class="fb-btn fb-btn-dark">New Bill</button><button id="printBtn" class="fb-btn">Print Bill</button><button id="whatsappBtn" class="fb-btn fb-btn-green" style="grid-column:1/-1">Send Bill on WhatsApp</button></div><p class="fb-note">WhatsApp opens with the complete bill. Tap Send in WhatsApp to deliver it.</p></aside></div></main></div>
<script src="assets/js/site.js?v=20261017-6"></script><script src="assets/js/booking.js?v=20261017-6"></script><script src="assets/js/food-billing.js?v=20261017-6"></script></body></html>
