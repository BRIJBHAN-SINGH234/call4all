<!doctype html><html lang="en-IN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Handmade Product Manager | Call4All</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/properties.css"><link rel="stylesheet" href="assets/css/marketplace.css"></head><body style="background:#f3f6f4"><header class="pa-top"><div><strong>🧶 Handmade Product Manager</strong><div style="font-size:12px;opacity:.8"><span id="managerRole">User</span> inventory panel</div></div><div><a class="btn btn-outline btn-sm" href="handmade-items.html" target="_blank" style="color:#fff;border-color:#fff">View Listings</a> <a class="btn btn-outline btn-sm" id="backPanel" href="admin.html" style="color:#fff;border-color:#fff">Back</a></div></header>
<main class="pa-wrap"><div class="pa-grid"><section class="pa-card"><h2 id="formTitle">Add Handmade Product</h2><p class="market-admin-note">All India handmade listing ke liye city aur state add karein. Admin products direct publish honge; staff products approval ke baad public honge.</p><form class="pa-form" id="handmadeForm"><input type="hidden" name="image_path"><label>Category *</label><select name="category" required><option value="">Select category</option><option>Home Decor</option><option>Jewellery</option><option>Clothing & Textile</option><option>Art & Painting</option><option>Gifts</option><option>Pottery</option><option>Wood Craft</option><option>Natural & Eco-friendly</option><option>Other</option></select><label>Product title *</label><input name="title" required maxlength="90" placeholder="e.g. Handmade Blue Pottery Vase"><div class="pa-row"><div><label>Artisan / maker</label><input name="artisan" placeholder="Maker or brand"></div><div><label>Materials</label><input name="materials" placeholder="Clay, cotton, wood…"></div></div><div class="pa-row"><div><label>Price (₹) *</label><input name="price" required type="number" min="1" step="1" placeholder="40"></div><div><label>Stock *</label><input name="stock" required type="number" min="0" step="1" value="1"></div></div><div class="pa-row"><div><label>City *</label><input name="city" required placeholder="e.g. Jaipur"></div><div><label>State *</label><input name="state" required placeholder="e.g. Rajasthan"></div></div><label>Area / Locality</label><input name="area" placeholder="e.g. Kukas"><label>Contact number *</label><input name="contact_phone" required type="tel" inputmode="tel" pattern="[0-9+() -]{7,15}" maxlength="15"><label>Product image *</label><input id="handmadeImage" type="file" accept="image/png,image/jpeg,image/webp"><label>Full product description *</label><textarea name="description" required rows="6" placeholder="Craft process, size, colour, care instructions, delivery details…"></textarea><h3>Google / SEO details</h3><label>SEO title</label><input name="meta_title" maxlength="70" placeholder="Handmade Product in Jaipur | Call4All"><label>Meta description</label><textarea name="meta_description" maxlength="170" rows="3" placeholder="Short, unique Google search description"></textarea><label>Search keywords</label><input name="keywords" placeholder="handmade gift Jaipur, local artisan, near me"><div id="saveStatus" style="margin-top:10px"></div><div class="pa-actions"><button class="pa-btn gold" type="submit">Save Product</button><button class="pa-btn" id="cancelEdit" type="button" hidden>Cancel</button></div></form></section><section class="pa-card"><h2>Saved Handmade Products</h2><div id="handmadeAdminList"><p>Loading…</p></div></section></div></main><script src="assets/js/site.js"></script><script src="assets/js/booking.js"></script><script src="assets/js/handmade-admin.js"></script></body></html>
