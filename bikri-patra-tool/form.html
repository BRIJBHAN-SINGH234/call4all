<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>बिक्री पत्र जनरेटर (5-पेज लीगल फॉर्मेट)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Arial', 'Helvetica', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .container {
            max-width: 1000px;
            width: 100%;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            padding: 30px;
            margin: 20px 0;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #e0e0e0;
        }
        
        h1 {
            color: #2c3e50;
            font-size: 2.3rem;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #7f8c8d;
            font-size: 1.1rem;
        }
        
        .form-section {
            margin-bottom: 30px;
            padding: 20px;
            border-radius: 10px;
            background-color: #f8f9fa;
            border-left: 5px solid #3498db;
        }
        
        .section-title {
            color: #2980b9;
            margin-bottom: 20px;
            font-size: 1.4rem;
        }
        
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #34495e;
        }
        
        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }
        
        .button-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }
        
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-generate { background: #27ae60; color: white; }
        .btn-print { background: #2980b9; color: white; }
        .btn-reset { background: #e74c3c; color: white; }
        
        /* Screen Preview CSS */
        .preview-container {
            margin-top: 40px;
            width: 100%;
            display: none;
        }
        
        .legal-page {
            background: #ffffff;
            border: 2px solid #2c3e50;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            padding: 60px 60px;
            margin-bottom: 40px;
            position: relative;
            min-height: 1050px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        
        .stamp-area-placeholder {
            width: 100%;
            height: 180px;
            border: 2px dashed #bdc3c7;
            background: #fafbfc;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #7f8c8d;
            font-weight: bold;
            margin-bottom: 30px;
        }
        
        .page-header-title {
            text-align: center;
            font-size: 1.8rem;
            font-weight: bold;
            text-decoration: underline;
            margin-bottom: 25px;
        }
        
        .page-number-top {
            position: absolute;
            top: 20px;
            right: 40px;
            font-size: 18px;
            font-weight: bold;
        }
        
        .legal-content {
            font-size: 17px;
            line-height: 2.2;
            text-align: justify;
            color: #000;
            flex-grow: 1;
        }
        
        .legal-content p {
            margin-bottom: 20px;
            text-indent: 40px;
        }
        
        .highlight {
            background-color: #fff59d;
            padding: 2px 4px;
            font-weight: bold;
        }
        
        .page-footer-signatures {
            margin-top: 30px;
            border-top: 1px dashed #000;
            padding-top: 20px;
        }
        
        .sig-table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .sig-table td {
            width: 50%;
            padding: 10px 0;
            vertical-align: top;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>बिक्री पत्र (Sale Deed) जनरेटर</h1>
            <p class="subtitle">5-पेज फॉर्मेट | डायनामिक PDF फाइल नाम सपोर्ट</p>
        </header>
        
        <form id="saleForm">
            <!-- १. विक्रेता विवरण -->
            <div class="form-section">
                <h2 class="section-title">१. विक्रेता (First Party) की जानकारी</h2>
                <div class="form-grid">
                    <div class="form-group"><label>विक्रेता का नाम</label><input type="text" id="sellerName" value="राजेन्द्र कुमार शर्मा"></div>
                    <div class="form-group"><label>पिता का नाम</label><input type="text" id="sellerFather" value="जगदीश प्रसाद शर्मा"></div>
                    <div class="form-group"><label>आयु (वर्ष)</label><input type="number" id="sellerAge" value="44"></div>
                    <div class="form-group"><label>जाति</label><input type="text" id="sellerCaste" value="हरियाणा ब्राह्मण"></div>
                    <div class="form-group" style="grid-column: span 2;"><label>पूर्ण निवास पता</label><input type="text" id="sellerAddress" value="ग्राम कूकस, तहसील आमेर, जिला जयपुर, (राजस्थान)"></div>
                    <div class="form-group"><label>आधार नंबर</label><input type="text" id="sellerAadhar" value="[Aadhaar Redacted]"></div>
                </div>
            </div>
            
            <!-- २. क्रेता विवरण -->
            <div class="form-section">
                <h2 class="section-title">२. क्रेता (Second Party) की जानकारी</h2>
                <div class="form-grid">
                    <div class="form-group"><label>क्रेता का नाम</label><input type="text" id="buyerName" value="कृष्णावतार सिंह"></div>
                    <div class="form-group"><label>पिता का नाम</label><input type="text" id="buyerFather" value="गजराज सिंह"></div>
                    <div class="form-group"><label>आयु (वर्ष)</label><input type="number" id="buyerAge" value="66"></div>
                    <div class="form-group"><label>जाति</label><input type="text" id="buyerCaste" value="राजपूत"></div>
                    <div class="form-group" style="grid-column: span 2;"><label>पूर्ण निवास पता</label><input type="text" id="buyerAddress" value="गुड़ा चन्द्रजी मार्ग, नड़ौती, नादौती, जिला करौली, (राजस्थान)"></div>
                    <div class="form-group"><label>आधार नंबर</label><input type="text" id="buyerAadhar" value="[Aadhaar Redacted]"></div>
                </div>
            </div>
            
            <!-- ३. प्लॉट विवरण -->
            <div class="form-section">
                <h2 class="section-title">३. प्लॉट एवं चौहद्दी (Boundary) विवरण</h2>
                <div class="form-grid">
                    <div class="form-group"><label>योजना का नाम</label><input type="text" id="schemeName" value="गणपति एनक्लेव"></div>
                    <div class="form-group"><label>प्लॉट नंबर</label><input type="text" id="plotNumber" value="141"></div>
                    <div class="form-group"><label>कुल क्षेत्रफल (वर्गगज)</label><input type="text" id="totalAreaSqYd" value="78.33"></div>
                    <div class="form-group"><label>कुल क्षेत्रफल (वर्गमीटर)</label><input type="text" id="totalAreaSqM" value="65.49"></div>
                    <div class="form-group"><label>उत्तर-दक्षिण पूर्व (फीट)</label><input type="text" id="dimNE" value="22"></div>
                    <div class="form-group"><label>इंच</label><input type="text" id="dimNEIn" value="9"></div>
                    <div class="form-group"><label>उत्तर-दक्षिण पश्चिम (फीट)</label><input type="text" id="dimNW" value="24"></div>
                    <div class="form-group"><label>इंच</label><input type="text" id="dimNWIn" value="3"></div>
                    <div class="form-group"><label>पूर्व-पश्चिम (फीट)</label><input type="text" id="dimEW" value="30"></div>
                    
                    <div class="form-group"><label>उत्तर की चौहद्दी</label><input type="text" id="boundNorth" value="अन्य की भूमि"></div>
                    <div class="form-group"><label>दक्षिण की चौहद्दी</label><input type="text" id="boundSouth" value="रोड 30 फीट चौड़ा"></div>
                    <div class="form-group"><label>पूर्व की चौहद्दी</label><input type="text" id="boundEast" value="प्लॉट नंबर 140"></div>
                    <div class="form-group"><label>पश्चिम की चौहद्दी</label><input type="text" id="boundWest" value="प्लॉट नंबर 142"></div>
                </div>
            </div>
            
            <!-- ४. वित्तीय भुगतान विवरण -->
            <div class="form-section">
                <h2 class="section-title">४. वित्तीय एवं भुगतान का प्रकार (Payment Mode)</h2>
                <div class="form-grid">
                    <div class="form-group"><label>निष्पादन दिनांक</label><input type="date" id="deedDate" value="2026-07-30"></div>
                    <div class="form-group"><label>आवंटन दिनांक</label><input type="date" id="allotmentDate" value="2024-06-10"></div>
                    <div class="form-group"><label>आवंटन रसीद संख्या</label><input type="text" id="receiptNumber" value="एच-66949"></div>
                    <div class="form-group"><label>विक्रय मूल्य (अंकों में)</label><input type="text" id="salePrice" value="4,82,000"></div>
                    <div class="form-group"><label>विक्रय मूल्य (शब्दों में)</label><input type="text" id="salePriceWords" value="चार लाख बयासी हजार"></div>
                    <div class="form-group">
                        <label>भुगतान का प्रकार</label>
                        <select id="paymentType" onchange="togglePaymentFields()">
                            <option value="चेक">चेक (Cheque)</option>
                            <option value="नकद">नकद (Cash)</option>
                            <option value="ऑनलाइन">ऑनलाइन (RTGS/NEFT/UPI)</option>
                            <option value="बैंक ड्राफ्ट">बैंक ड्राफ्ट (DD)</option>
                        </select>
                    </div>
                    <div class="form-group" id="chkNoGroup"><label id="paymentNoLabel">चेक नम्बर</label><input type="text" id="chequeNumber" value="895356"></div>
                    <div class="form-group" id="bankGroup" style="grid-column: span 2;"><label>बैंक नाम व शाखा</label><input type="text" id="bankBranch" value="पंजाब नेशनल बैंक शाखा नादौती (करौली), राजस्थान"></div>
                </div>
            </div>
            
            <!-- ५. गवाह विवरण -->
            <div class="form-section">
                <h2 class="section-title">५. साक्षीगण (Witnesses) विवरण</h2>
                <div class="form-grid">
                    <div class="form-group"><label>गवाह 1 नाम</label><input type="text" id="w1Name" value="रोहित शर्मा"></div>
                    <div class="form-group"><label>पिता का नाम</label><input type="text" id="w1Father" value="युवराज शर्मा"></div>
                    <div class="form-group"><label>आयु</label><input type="number" id="w1Age" value="24"></div>
                    <div class="form-group"><label>जाति</label><input type="text" id="w1Caste" value="हरियाणा ब्राह्मण"></div>
                    <div class="form-group" style="grid-column: span 2;"><label>पता</label><input type="text" id="w1Address" value="निवासी ब्राह्मणों का मौहल्ला, ग्राम कूकस, तहसील आमेर, जिला जयपुर, राजस्थान।"></div>
                    
                    <div class="form-group"><label>गवाह 2 नाम</label><input type="text" id="w2Name" value="रमेश चन्द शर्मा"></div>
                    <div class="form-group"><label>पिता का नाम</label><input type="text" id="w2Father" value="छीतर मल शर्मा"></div>
                    <div class="form-group"><label>आयु</label><input type="number" id="w2Age" value="47"></div>
                    <div class="form-group"><label>जाति</label><input type="text" id="w2Caste" value="हरियाणा ब्राह्मण"></div>
                    <div class="form-group" style="grid-column: span 2;"><label>पता</label><input type="text" id="w2Address" value="निवासी तेजाजी मन्दिर के पास, ग्राम कूकस, तहसील आमेर, जिला जयपुर, राजस्थान।"></div>
                </div>
            </div>

            <div class="button-container">
                <button type="button" class="btn btn-generate" onclick="viewScreenPreview()">1. स्क्रीन प्रिव्यू देखें</button>
                <button type="button" class="btn btn-print" onclick="printDocumentDirectly()">2. प्रिंट / PDF डाउनलोड करें</button>
                <button type="button" class="btn btn-reset" onclick="document.getElementById('saleForm').reset();">रीसेट</button>
            </div>
        </form>

        <div class="preview-container" id="legalDocumentOutput"></div>
    </div>

    <!-- Hidden iframe used for absolute clean print rendering -->
    <iframe id="printFrame" style="display:none; width:0; height:0; border:none;"></iframe>

    <script>
        function togglePaymentFields() {
            const mode = document.getElementById('paymentType').value;
            const chkGroup = document.getElementById('chkNoGroup');
            const bankGroup = document.getElementById('bankGroup');
            const label = document.getElementById('paymentNoLabel');
            
            if (mode === 'नकद') {
                chkGroup.style.display = 'none';
                bankGroup.style.display = 'none';
            } else {
                chkGroup.style.display = 'block';
                bankGroup.style.display = 'block';
                if (mode === 'चेक') label.innerText = "चेक नम्बर";
                else if (mode === 'ऑनलाइन') label.innerText = "ट्रांजैक्शन ID / UTR नंबर";
                else if (mode === 'बैंक ड्राफ्ट') label.innerText = "डिमांड ड्राफ्ट (DD) नंबर";
            }
        }

        function formatDate(dateStr) {
            if(!dateStr) return '';
            const d = dateStr.split('-');
            return `${d[2]}/${d[1]}/${d[0]}`;
        }

        function generateHTMLContent() {
            const sName = document.getElementById('sellerName').value;
            const sFather = document.getElementById('sellerFather').value;
            const sAge = document.getElementById('sellerAge').value;
            const sCaste = document.getElementById('sellerCaste').value;
            const sAddr = document.getElementById('sellerAddress').value;
            const sAadhar = document.getElementById('sellerAadhar').value;

            const bName = document.getElementById('buyerName').value;
            const bFather = document.getElementById('buyerFather').value;
            const bAge = document.getElementById('buyerAge').value;
            const bCaste = document.getElementById('buyerCaste').value;
            const bAddr = document.getElementById('buyerAddress').value;
            const bAadhar = document.getElementById('buyerAadhar').value;

            const scheme = document.getElementById('schemeName').value;
            const plot = document.getElementById('plotNumber').value;
            const areaYd = document.getElementById('totalAreaSqYd').value;
            const areaM = document.getElementById('totalAreaSqM').value;
            const dNE = document.getElementById('dimNE').value;
            const dNEIn = document.getElementById('dimNEIn').value;
            const dNW = document.getElementById('dimNW').value;
            const dNWIn = document.getElementById('dimNWIn').value;
            const dEW = document.getElementById('dimEW').value;

            const bNorth = document.getElementById('boundNorth').value;
            const bSouth = document.getElementById('boundSouth').value;
            const bEast = document.getElementById('boundEast').value;
            const bWest = document.getElementById('boundWest').value;

            const deedDate = formatDate(document.getElementById('deedDate').value);
            const allotDate = formatDate(document.getElementById('allotmentDate').value);
            const rcptNo = document.getElementById('receiptNumber').value;
            const price = document.getElementById('salePrice').value;
            const priceW = document.getElementById('salePriceWords').value;
            
            const payType = document.getElementById('paymentType').value;
            const payNo = document.getElementById('chequeNumber').value;
            const bank = document.getElementById('bankBranch').value;

            const w1 = document.getElementById('w1Name').value;
            const w1F = document.getElementById('w1Father').value;
            const w1A = document.getElementById('w1Age').value;
            const w1C = document.getElementById('w1Caste').value;
            const w1Add = document.getElementById('w1Address').value;

            const w2 = document.getElementById('w2Name').value;
            const w2F = document.getElementById('w2Father').value;
            const w2A = document.getElementById('w2Age').value;
            const w2C = document.getElementById('w2Caste').value;
            const w2Add = document.getElementById('w2Address').value;

            let paymentString = "";
            if (payType === 'नकद') {
                paymentString = `सम्पूर्ण विक्रय राशि <span class="highlight">${price}/- रुपये</span> (अक्षरे <span class="highlight">${priceW} रुपये</span>) द्वितीय पक्ष से नकद (Cash) के रूप में प्राप्त कर ली है।`;
            } else {
                paymentString = `सम्पूर्ण विक्रय राशि <span class="highlight">${price}/- रुपये</span> (अक्षरे <span class="highlight">${priceW} रुपये</span>) द्वितीय पक्ष से जरिये <span class="highlight">${payType} नम्बर ${payNo}</span>, <span class="highlight">${bank}</span> दिनांक <span class="highlight">${deedDate}</span> द्वारा प्राप्त कर ली है।`;
            }

            const midPageSignatures = `
                <div class="page-footer-signatures">
                    <table class="sig-table">
                        <tr>
                            <td><strong>हस्ताक्षर प्रथम पक्ष (विक्रेता):</strong> _________________</td>
                            <td><strong>हस्ताक्षर द्वितीय पक्ष (क्रेता):</strong> _________________</td>
                        </tr>
                    </table>
                </div>
            `;

            return `
                <!-- PAGE 1 -->
                <div class="legal-page">
                    <div class="page-number-top">(1)</div>
                    <div class="stamp-area-placeholder">₹___ के स्टाम्प पेपर हेतु स्थान (प्रथम पृष्ठ)</div>
                    <div class="page-header-title">विक्रय पत्र (SALE DEED)</div>
                    <div class="legal-content">
                        <p>यह विक्रय पत्र आज दिनांक <span class="highlight">${deedDate}</span> को श्री <span class="highlight">${sName}</span> पुत्र श्री <span class="highlight">${sFather}</span>, आयु <span class="highlight">${sAge}</span> वर्ष, जाति <span class="highlight">${sCaste}</span>, निवासी <span class="highlight">${sAddr}</span>। जिन्हें इस विक्रय पत्र में आगे <strong>"प्रथम पक्ष विक्रेता"</strong> या <strong>"प्रथम पक्ष"</strong> के नाम से संबोधित किया गया है (जिसमें प्रथम पक्ष स्वयं एवं उनके समस्त विधिक वारिसान, उत्तराधिकारी, प्रतिनिधि, सहभागी, स्थानापन्न, असाइनीज इत्यादि सभी सम्मिलित समझे जाएँगे) की ओर से:-</p>
                        <p>श्री <span class="highlight">${bName}</span> पुत्र श्री <span class="highlight">${bFather}</span>, आयु <span class="highlight">${bAge}</span> वर्ष, जाति <span class="highlight">${bCaste}</span>, निवासी <span class="highlight">${bAddr}</span>। जिन्हें इस विक्रय पत्र में आगे <strong>"द्वितीय पक्ष क्रेता"</strong> या <strong>"द्वितीय पक्ष"</strong> के नाम से संबोधित किया गया है, के हक में निम्न प्रकार से विक्रय पत्र लेखबद्ध किया जा रहा है:-</p>
                    </div>
                    ${midPageSignatures}
                </div>

                <!-- PAGE 2 -->
                <div class="legal-page">
                    <div class="page-number-top">(2)</div>
                    <div class="stamp-area-placeholder">₹___ के स्टाम्प पेपर हेतु स्थान (द्वितीय पृष्ठ)</div>
                    <div class="legal-content">
